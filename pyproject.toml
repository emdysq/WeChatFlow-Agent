[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechatflow-agent"
dynamic = ["version"]
description = "WeChatFlow Agent：可审阅改稿、Windows 交付与微信公众号草稿工作流"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "markdown>=3.10",
    "beautifulsoup4>=4.14",
    "cssutils>=2.11",
    "requests>=2.32",
    "pyyaml>=6.0",
    "Pygments>=2.17",
    "Pillow>=10.0",
    "pypdf>=6.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# fetch-article 的二级降级（Playwright 抓取）；不装也能用 requests 路径
browser = ["playwright>=1.50", "camoufox[geoip]>=0.4"]

[project.urls]
Repository = "https://github.com/emdysq/WeChatFlow-Agent"

[project.scripts]
wewrite = "wewrite.cli:main"
wechatflow = "wewrite.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wewrite = [
    "toolkit/themes/*.yaml",
    "data/*.md",
]
